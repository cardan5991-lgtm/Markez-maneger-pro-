<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Markez Pro" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="192x192" href="/markez-192.png" />
    <link rel="apple-touch-icon" href="/markez-512.png" />
    <!-- VitePWA automatically injects the manifest link, but we can also leave it if desired. The plugin docs recommend letting the plugin inject it, but we can safely omit the manual one. Actually, wait. The plugin docs say: "When you run vite build, it will generate the service worker file and the Web App Manifest file... and it will inject the manifest link and the service worker registration in the index.html." So we remove the manual one. -->
    <title>Markez Manager Pro</title>
  </head>
  <body style="touch-action: pan-y; -webkit-touch-callout: none;">
    <div id="root"></div>
    <script>
      // Bloqueo estricto de pinch zoom a nivel de documento
      document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });
      document.addEventListener('touchmove', function(event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });
      
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPrompt = e;
        window.dispatchEvent(new Event('pwa-install-ready'));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
